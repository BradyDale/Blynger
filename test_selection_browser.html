<!doctype html><meta charset="utf-8"><title>Blynger quotation checks</title><style>body{font:13px monospace;background:#eeeee5}iframe{width:100%;height:650px}pre{white-space:pre-wrap}</style><button id="run">Run all four quote workflows</button><pre id="results">Ready — disposable site only.</pre><iframe id="app" src="/"></iframe><script>
const out=document.getElementById('results');function ok(test,label){if(!test)throw Error(label);out.textContent+='\nPASS '+label}async function until(fn){for(let n=0;n<200;n++){if(fn())return;await new Promise(r=>setTimeout(r,30))}throw Error('UI timed out')}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;out.textContent='Running';try{
const w=document.getElementById('app').contentWindow,d=w.document,$=id=>d.getElementById(id);await until(()=>$('heading').textContent==='Openers');const items=(await w.api('reader')).items;const thread=items.find(i=>i.kind==='thread'),plain=items.find(i=>i.source_type==='l0');let posts=[];
async function read(item){await w.readItem(item);await until(()=>$('readerFrame')?.contentDocument?.querySelector('#readerContent'));await new Promise(r=>setTimeout(r,70));return $('readerFrame').contentDocument}
async function quote(title){$('quoteReading').click();await until(()=>$('quoteTitle'));$('quoteTitle').value=title;$('createQuotedPost').click();await until(()=>$('heading').textContent===title&&$('saveState').textContent==='Draft saved');const name=$('filename').textContent.split('/').pop().trim();posts.push(name);return w.api('page?name='+name)}
await read(thread);ok($('quoteReading').textContent==='Quote','No selection offers whole Quote');let p=await quote('Whole source');ok(p.body.includes('Final paragraph.')&&Object.values(p.quotes)[0].source.version===2,'Whole item enters editor with original version');
let rd=await read(thread);const dot=rd.querySelector('.reader-fragment-dot');ok(dot&&dot.title.includes('Fragment')&&rd.defaultView.getComputedStyle(dot).position==='absolute'&&dot.textContent==='','Fragment dot is subtle, outside text flow, with tooltip');dot.click();ok($('quoteReading').textContent==='Quote fragment','Dot activates genuine source fragment');p=await quote('Fragment source');ok(!p.body.includes('Introductory')&&Object.values(p.quotes)[0].source.id.endsWith('2')&&Object.values(p.quotes)[0].source.version===3,'Genuine fragment preserves its own ID and exact version');
rd=await read(thread);let target=rd.querySelector('blockquote p');let range=rd.createRange();range.selectNodeContents(target);rd.getSelection().removeAllRanges();rd.getSelection().addRange(range);rd.dispatchEvent(new Event('selectionchange'));ok($('quoteReading').textContent==='Quote fragment','Exact text selection prefers actual fragment');
range=rd.createRange();range.setStart(target.firstChild,16);range.setEnd(target.firstChild,28);rd.getSelection().removeAllRanges();rd.getSelection().addRange(range);rd.dispatchEvent(new Event('selectionchange'));ok($('quoteReading').textContent==='Quote selection','Partial fragment becomes an excerpt');p=await quote('Selected sentence');let record=Object.values(p.quotes)[0];ok(record.type==='excerpt'&&record.source.id.endsWith('1')&&record.text==='Exact words!'&&!p.body.includes('Second fragment'),'Excerpt uses enclosing thread identity and exact wording');
rd=await read(thread);const blocks=rd.querySelectorAll('blockquote p');range=rd.createRange();range.setStart(blocks[0].firstChild,0);range.setEnd(blocks[1].firstChild,blocks[1].textContent.length);rd.getSelection().removeAllRanges();rd.getSelection().addRange(range);rd.dispatchEvent(new Event('selectionchange'));ok($('quoteReading').textContent==='Quote selection','Selection spanning fragments is an ordinary excerpt');p=await quote('Several paragraphs');record=Object.values(p.quotes)[0];ok(record.text.includes('\n')&&record.text.includes('Second fragment.')&&record.source.id.endsWith('1'),'Paragraph breaks and source order survive');
rd=await read(plain);target=rd.querySelectorAll('p')[1];range=rd.createRange();range.selectNodeContents(target);rd.getSelection().removeAllRanges();rd.getSelection().addRange(range);rd.dispatchEvent(new Event('selectionchange'));p=await quote('Ordinary RSS selection');record=Object.values(p.quotes)[0];ok(record.source.type==='l0'&&!('id'in record.source)&&!('version'in record.source)&&record.source.author.name==='RSS Author','Ordinary RSS quote has attribution without fake Blyg identity');
rd=await read(thread);range=rd.createRange();range.selectNodeContents(rd.body);rd.getSelection().removeAllRanges();rd.getSelection().addRange(range);rd.dispatchEvent(new Event('selectionchange'));ok($('quoteReading').disabled,'Selection outside article content is rejected');$('closeDialog').click();
for(const name of posts){await w.openPage(name);ok(!!$('editor').querySelector('blockquote[data-blynger-quote]'),'Saved quote reloads in '+name)}
const review=await w.api('prepare',{});await w.api('publish',{signature:review.signature});ok(true,'All quotation modes publish to disposable local Git remote');for(const name of posts){await w.openPage(name);const r=await fetch('/preview/'+name);const html=await r.text();ok(!html.includes('data-blynger-quote')&&html.includes('blockquote'),'Public HTML contains quote without private editor token: '+name)}
out.textContent+='\nALL SELECTION WORKFLOWS PASSED';
}catch(e){out.textContent+='\nFAIL '+e.stack}}
</script>
