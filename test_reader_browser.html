<!doctype html><meta charset="utf-8"><title>Blynger reader checks</title><style>body{font:13px monospace;background:#eeeee5}iframe{width:100%;height:750px;border:1px solid #888}pre{white-space:pre-wrap}</style><button id="run">Run reader workflow checks</button><pre id="results">Ready — writes only to a disposable site.</pre><iframe id="app" src="/"></iframe><script>
const output=document.getElementById('results');function assert(value,label){if(!value)throw Error(label);output.textContent+='\nPASS '+label}
async function until(fn){for(let n=0;n<500;n++){if(fn())return;await new Promise(r=>setTimeout(r,50));}throw Error('Timed out waiting for UI state')}
document.getElementById('run').onclick=async()=>{document.getElementById('run').disabled=true;output.textContent='Running';try{
const frame=document.getElementById('app'),w=frame.contentWindow,d=frame.contentDocument,$=id=>d.getElementById(id);
await until(()=>$('heading').textContent==='Openers');
assert(!/File|Website|Help|Edit/.test(d.querySelector('.menubar').textContent),'Dead header menus removed');assert($('mainFragment').textContent==='Fragment','Main toolbar Fragment button present');
$('readerNav').click();await until(()=>$('readerStatus').textContent.includes('Add a Blyg'));assert(!$('readerView').hidden,'Reader handles zero subscriptions');
$('readerAdd').click();assert($('dialog').open&&$('readerURL'),'Add Blyg opens a URL discovery dialog');$('readerURL').value='https://blyg.aneeshsathe.com/';$('confirmSubscribe').click();assert($('readerAdd').disabled&&$('readerSync').textContent==='Syncing…','Sync feedback appears immediately');await until(()=>!$('readerAdd').disabled);
assert($('readerItems').children.length>0,'Aneesh subscription imported published items');const firstCount=$('readerItems').children.length;$('readerSync').click();await until(()=>!$('readerSync').disabled);assert($('readerItems').children.length===firstCount,'Refreshing does not duplicate items');
$('readerItems').querySelector('.read-item').click();await until(()=>$('readerFrame'));assert($('dialogBody').textContent.includes('aneeshsathe.com'),'Full reader item identifies its origin');
$('quoteReading').click();await until(()=>$('quoteTitle'));$('quoteTitle').value='Reader quote test — disposable';$('createQuotedPost').click();await until(()=>$('saveState').textContent==='Draft saved'&&$('heading').textContent==='Reader quote test — disposable');assert(!!$('editor').querySelector('blockquote.blyg-transclusion'),'Quote enters normal authoring flow');
$('editHeadline').click();$('headlineText').value='My own response headline';$('saveHeadline').click();await until(()=>$('heading').textContent==='My own response headline'&&$('saveState').textContent==='Draft saved');assert($('editor').querySelector('h1').textContent==='My own response headline'&&!!$('editor').querySelector('blockquote.blyg-transclusion'),'Response headline changes without replacing the quote');
$('quote').click();await until(()=>$('quoteRows'));assert($('quoteRows').textContent.includes('MY BLYG')&&$('quoteRows').textContent.includes("Aneesh"),'Quote picker includes local and remote sources');$('closeDialog').click();
// The main button calls the exact command used by the keyboard. Compare persisted metadata on the same anchors.
const e=$('editor');e.innerHTML='<h1>Test title</h1><p>First body paragraph.</p><p>Second body paragraph.</p><p>—Example Author<br>September 26, 2026</p>';e.dispatchEvent(new Event('input',{bubbles:true}));
function caret(){const r=d.createRange();r.setStart(e.children[2].firstChild,0);r.collapse(true);w.getSelection().removeAllRanges();w.getSelection().addRange(r);e.dispatchEvent(new Event('keyup'));}
caret();$('mainFragment').click();await w.save();const buttonState=(await w.api('page?name='+$('filename').textContent.split('/').pop().trim())).fragments;
$('mainFragment').click();caret();e.dispatchEvent(new KeyboardEvent('keydown',{key:'f',ctrlKey:true,shiftKey:true,bubbles:true,cancelable:true}));await w.save();const keyboardState=(await w.api('page?name='+$('filename').textContent.split('/').pop().trim())).fragments;
assert(JSON.stringify(buttonState)===JSON.stringify(keyboardState),'Button and keyboard produce identical fragment metadata');
let prepareCalls=0,publishCalls=0,fail=true,release;const nativeFetch=w.fetch.bind(w);w.fetch=async(url,opts)=>{if(String(url).endsWith('/api/prepare')){prepareCalls++;await new Promise(r=>setTimeout(r,300));}if(String(url).endsWith('/api/publish')){publishCalls++;await new Promise(r=>release=r);if(fail)return new Response(JSON.stringify({error:'Test connection failure — draft preserved'}),{status:400,headers:{'Content-Type':'application/json'}});}return nativeFetch(url,opts);};
$('publish').click();$('publish').click();assert($('publish').disabled&&$('publish').textContent==='Preparing…','Review feedback and duplicate protection are immediate');await until(()=>$('confirmPublish')&&!$('publish').disabled);assert(prepareCalls===1,'Only one preparation request');
$('confirmPublish').click();$('confirmPublish').click();assert($('publish').disabled&&$('confirmPublish').disabled&&$('confirmPublish').textContent==='Publishing…','Publish activity and duplicate protection are immediate');await until(()=>!!release);release();await until(()=>$('confirmPublish').textContent==='Retry publication');assert(publishCalls===1&&!$('publish').disabled&&$('publishResult').textContent.includes('Test connection failure'),'Failure visible and controls restored');const pages=await w.api('pages');assert(pages.some(p=>p.draft),'Failure preserves saved draft');
fail=false;release=null;$('confirmPublish').click();await until(()=>!!release);release();await until(()=>$('confirmPublish').textContent==='Done'&&!$('confirmPublish').disabled);assert(!$('publish').disabled&&!$('confirmPublish').disabled,'Successful local Git publication restores controls');$('confirmPublish').click();
$('deletePost').click();assert($('confirmDelete').textContent==='Delete post','Delete requires confirmation');$('confirmDelete').click();await until(()=>$('deletePost').textContent==='Restore post…');assert(!$('editor').isContentEditable,'Deleted post is protected from editing');$('deletePost').click();$('confirmDelete').click();await until(()=>$('deletePost').textContent==='Delete post…');assert($('editor').isContentEditable&&$('editor').textContent.includes('First body paragraph.'),'Restore recovers the post content');
output.textContent+='\nALL READER UI CHECKS PASSED';
}catch(e){output.textContent+='\nFAIL '+e.stack}}
</script>
