    <text x="372" y="275">BLYG · Mina Example · smallweb.test · Oct 24</text>
    <text x="372" y="353">WEB / RSS · Example Review · Oct 24</text>
    <text x="372" y="802">BLYG · Jules Example · notes.test · Oct 23</text>
  </g>
  <g font-family="Georgia,serif" fill="#173a38" font-weight="bold">
    <text x="372" y="305" font-size="21">A note about keeping useful friction</text>
    <text x="372" y="385" font-size="23">The small web is a place, not a product</text>
    <text x="372" y="832" font-size="21">What I found while reading slowly</text>
  </g>
  <line x1="366" y1="325" x2="1370" y2="325" stroke="#9aa8a1" stroke-dasharray="3 5"/>
  <line x1="366" y1="779" x2="1370" y2="779" stroke="#9aa8a1" stroke-dasharray="3 5"/>

  <rect x="367" y="404" width="1001" height="352" fill="#fffdf4" stroke="#385f57" stroke-width="4"/>
  <rect x="385" y="423" width="966" height="40" fill="#e4eee6"/>
  <rect x="399" y="431" width="220" height="24" fill="#f4f1e6" stroke="#82958a"/>
  <text x="509" y="448" text-anchor="middle" fill="#173a38" font-family="Courier New,monospace" font-size="12">← Backward: Earlier note</text>
  <rect x="1110" y="431" width="226" height="24" fill="#f4f1e6" stroke="#82958a"/>
  <text x="1223" y="448" text-anchor="middle" fill="#173a38" font-family="Courier New,monospace" font-size="12">Forward: A response →</text>
  <text x="407" y="505" fill="#243b34" font-family="Georgia,serif" font-size="20">A personal site can be useful precisely because it does not try</text>
  <text x="407" y="540" fill="#243b34" font-family="Georgia,serif" font-size="20">to anticipate every desire. Its edges can remain visible, and its</text>
  <text x="407" y="575" fill="#243b34" font-family="Georgia,serif" font-size="20">history can stay legible instead of being continuously flattened.</text>
  <text x="407" y="625" fill="#5c6d66" font-family="Georgia,serif" font-size="17">The next post remains below. Opening it closes this card.</text>
  <rect x="385" y="691" width="966" height="48" fill="#edf0e7" stroke="#9aa8a1"/>
  <g font-family="Courier New,monospace" font-size="14" fill="#173a38">
